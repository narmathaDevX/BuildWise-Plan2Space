services:
  # ------------------------------------------------------------
  # 1. Plan2Space 3D: FastAPI 2D-to-3D Model & Studio Service
  # ------------------------------------------------------------
  - type: web
    name: plan2space-3d
    runtime: python
    rootDir: plan2space-3d
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10

  # ------------------------------------------------------------
  # 2. BuildWise Backend: Core REST API & Floorplan Engine
  # ------------------------------------------------------------
  - type: web
    name: buildwise-backend
    runtime: python
    rootDir: buildwise
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10

  # ------------------------------------------------------------
  # 3. BuildWise Frontend: Single Page Application (React / Vite)
  # ------------------------------------------------------------
  - type: web
    name: buildwise-frontend
    runtime: static
    rootDir: buildwise/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://buildwise-backend-ylo3.onrender.com
      - key: VITE_DESIGN_STUDIO_URL
        fromService:
          type: web
          name: plan2space-3d
          property: host
